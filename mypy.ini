[mypy]
strict = True
enable_error_code =
    deprecated,
    exhaustive-match,
    explicit-override,
    ignore-without-code,
    mutable-override,
    possibly-undefined,
    redundant-expr,
    redundant-self,
    truthy-bool,
    truthy-iterable,
    unimported-reveal,
    unused-awaitable,
    unused-ignore
files = src/
disallow_untyped_decorators = False
